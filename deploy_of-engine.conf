# Phase 8：订单流信号引擎(反转承接v1)，每5分钟评估一次，命中规则生成纸面信号
# 独立于综合分引擎(btc-signal-engine)，写 of_signals 表，AtasBridge 图上显示
[program:btc-of-engine]
command=/opt/btc-trader/venv/bin/python3 /opt/btc-trader/monitor/of_engine.py
directory=/opt/btc-trader
user=root
autostart=true
autorestart=true
startretries=5
startsecs=10
stopwaitsecs=15
stdout_logfile=/opt/btc-trader/logs/of_engine_out.log
stderr_logfile=/opt/btc-trader/logs/of_engine_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="/root",PATH="/opt/btc-trader/venv/bin:/usr/local/bin:/usr/bin:/bin"
